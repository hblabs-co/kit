name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [core, mail, mongo, natsx, objectstore, observability, web]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      # Sibling modules resolve through the `replace ../core` line in
      # each go.mod, so no token is needed here.
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: go mod tidy is clean
        run: go mod tidy -diff

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -count=1 -covermode=atomic -coverprofile=cover.out ./...

      - name: coverage
        run: |
          pct="$(go tool cover -func=cover.out | awk '/^total:/ {sub("%","",$3); print $3}')"
          echo "${{ matrix.module }} ${pct}" > "coverage-${{ matrix.module }}.txt"
          echo "### ${{ matrix.module }}: ${pct}% of statements covered" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.module }}
          path: ${{ matrix.module }}/coverage-${{ matrix.module }}.txt

  # Publishes one shields.io endpoint file per module to the `badges` branch; the README badges read
  # them. Only on main, so pull requests never write to the repository.
  badges:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
          path: in
      - name: write badge files
        run: |
          mkdir out
          cat in/*.txt | while read -r module pct; do
            color=red
            awk "BEGIN{exit !($pct >= 60)}" && color=yellow
            awk "BEGIN{exit !($pct >= 80)}" && color=brightgreen
            printf '{"schemaVersion":1,"label":"%s coverage","message":"%s%%","color":"%s"}\n' \
              "$module" "$pct" "$color" > "out/coverage-$module.json"
          done
          ls out
      - name: push to the badges branch
        working-directory: out
        run: |
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "coverage for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badges
